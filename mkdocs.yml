site_name: Learning Technology Tools Portal
site_url: https://unity-environmental-university.github.io/lt-tools-documentation/
use_directory_urls: false

theme:
  name: material

plugins:
  - search
  - multirepo:
      # We leave this empty because the plugin is ignoring it anyway
      repos: []

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Learning Design Extension: "!import https://github.com/Unity-Environmental-University/lxd-tools?branch=main&docs_dir=*"
  - ueu-canvas package: "!import https://github.com/Unity-Environmental-University/ueu_canvas?branch=main"
  - Sprint Summary Script: "!import https://github.com/siekmang/trello-reporting-tool"
  - LISA: "!import https://github.com/Unity-Environmental-University/matt_lisa?branch=main"
  - XR Education:
      - How the tools work together: xr-education/index.md
      - Summit:
          - Summit: xr-education/summit/index.md
          - Send your first event: xr-education/summit/first-event.md
          - Connect a Unity game: xr-education/summit/unity.md
          - Data and reporting reference: xr-education/summit/data.md
      - Trailhead:
          - Trailhead: xr-education/trailhead/index.md
          - Replay a sample recording: xr-education/trailhead/first-replay.md
          - Record from Unity: xr-education/trailhead/unity.md
          - Recording and sync reference: xr-education/trailhead/recording.md
      - Waste Management: "!import https://github.com/Unity-Environmental-University/WasteManagement?branch=main"
      - XR Tools:
          - XR Tools: xr-education/xr-tools/index.md
          - Deploy a test build: xr-education/xr-tools/deploy.md
          - Develop and release XR Tools: xr-education/xr-tools/development.md
      - XR Tools Updater Service:
          - XR Tools Updater Service: xr-education/xr-tools-updater-service/index.md
          - Check an updater release: xr-education/xr-tools-updater-service/verify.md
