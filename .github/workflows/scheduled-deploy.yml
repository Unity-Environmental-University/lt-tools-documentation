name: Deploy MkDocs Site

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch: {}

# Deny everything by default; the deploy job asks only for what it needs.
permissions: {}

# gh-deploy force-pushes gh-pages, so never let two deploys overlap.
concurrency:
  group: deploy-gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the built site to gh-pages
    steps:
      - name: Checkout PoC Repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Build and Deploy to GH Pages
        env:
          # Needed by mkdocs-multirepo-plugin to import private repos (matt_lisa).
          # Scoped to this step only so earlier steps never see it.
          GithubAccessToken: ${{ secrets.GH_TOKEN }}
        run: |
          mkdocs gh-deploy --force
